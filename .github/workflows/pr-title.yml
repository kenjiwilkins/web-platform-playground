# squash マージでは PR タイトルがそのままコミットメッセージになるので、Conventional Commits を強制する
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            pg
            chore
            docs
            refactor
            test
            ci
            build
          # pg(css): add anchor-name のように、Playground 追加はカテゴリを scope に書く
          requireScope: false
