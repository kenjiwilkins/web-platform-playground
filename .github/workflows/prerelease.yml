# 先行版ブラウザ（Chrome Beta）で全 Playground を夜間実行する。
# 実験的機能は落ちて当然なので必須チェックにはしない。結果の変化を Issue で知らせる。
name: Prerelease browsers

on:
  schedule:
    - cron: '17 18 * * *' # 毎日 03:17 JST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chrome-beta
      - id: test
        run: pnpm test:e2e
        env:
          PRERELEASE: '1'
        continue-on-error: true
      - name: 失敗したら Issue を更新
        if: steps.test.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Prerelease browsers: E2E が失敗しています"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          body="$(date -u +%F) の実行で失敗: $RUN_URL"
          if [ -n "$number" ]; then gh issue comment "$number" --body "$body";
          else gh issue create --title "$title" --body "$body"; fi
