title: light-dark() image values
summary: light-dark() に色だけでなく画像（グラデーションや url()）を渡し、color-scheme に応じて切り替える。
mdn: Web/CSS/Reference/Values/color_value/light-dark
spec: https://drafts.csswg.org/css-color-5/#typedef-light-dark-image
webFeature: light-dark-image
bcd: css.types.color.light-dark.image_value
detect: CSS.supports('background-image', 'light-dark(linear-gradient(red, blue), linear-gradient(blue, red))')
tags: [color, color-scheme, gradient]
added: 2026-11-16
variants: [basic, url]
