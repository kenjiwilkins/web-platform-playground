<h1>light-dark() に画像を渡す</h1>
<p id="support"></p>
<div class="row">
  <div class="box light">color-scheme: light</div>
  <div class="box dark">color-scheme: dark</div>
</div>
<p>下の枠は <code>color-scheme</code> をトグルで切り替える（OS 設定に依らず確認できる）。</p>
<label><input type="checkbox" id="toggle"> dark にする</label>
<div class="box" id="live">live</div>
